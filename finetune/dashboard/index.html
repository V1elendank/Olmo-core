<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fine-tune Control Panel</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #e4e3df; --line2: #efeeea;
  --text: #0b0b0b; --muted: #52514e; --faint: #8b8a85;
  --blue: #2a78d6; --orange: #eb6834; --aqua: #1baf7a; --red: #d23f3f; --amber: #c98a12;
  --blue-bg: #e8f1fc; --orange-bg: #fdeee7; --aqua-bg: #e3f6ef; --red-bg: #fbe9e9; --amber-bg: #fbf2df;
  --train-bg: #fde3d6; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --panel: #1b1b1a; --line: #2e2e2c; --line2: #252523;
    --text: #f1f0ec; --muted: #b3b1ab; --faint: #7d7b76;
    --blue-bg: #17283d; --orange-bg: #3a2218; --aqua-bg: #123128; --red-bg: #3a1a1a; --amber-bg: #352a12;
    --train-bg: #4a2717;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --panel: #1b1b1a; --line: #2e2e2c; --line2: #252523;
  --text: #f1f0ec; --muted: #b3b1ab; --faint: #7d7b76;
  --blue-bg: #17283d; --orange-bg: #3a2218; --aqua-bg: #123128; --red-bg: #3a1a1a; --amber-bg: #352a12;
  --train-bg: #4a2717;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.hwrap { max-width: 1320px; margin: 0 auto; padding: 12px 16px 0; }
.htop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
nav { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
nav button { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 12px;
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }
main { max-width: 1320px; margin: 0 auto; padding: 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
  padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h2 { font-size: 13px; margin: 0 0 10px; font-weight: 650; }
.card h3 { font-size: 12.5px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .s { color: var(--faint); font-size: 12px; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px;
  border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--line2); }
.tw { overflow-x: auto; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.p-run { background: var(--blue-bg); color: var(--blue); } .p-ok { background: var(--aqua-bg); color: var(--aqua); }
.p-bad { background: var(--red-bg); color: var(--red); } .p-wait { background: var(--amber-bg); color: var(--amber); }
.p-idle { background: var(--line2); color: var(--muted); }
.bar { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--blue); }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; }
pre { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap;
  word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; max-height: 420px; overflow: auto; }
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; align-items: start; }
.split > * { min-width: 0; }
.list { padding: 6px; }
.li { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.li:hover { background: var(--line2); } .li.on { background: var(--blue-bg); }
.li .t { font-weight: 600; font-size: 13px; word-break: break-all; }
.li .d { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-top: 3px; }
.charts { grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
.chart .ttl { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.chart .ttl b { font-size: 12.5px; } .chart .ttl span { font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  white-space: nowrap; display: none; z-index: 3; }
.axis text { fill: var(--faint); font-size: 10.5px; font-family: inherit; }
.axis line { stroke: var(--line2); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; }
.stat .l { color: var(--muted); font-size: 11.5px; } .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.55;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 380px; overflow: auto; }
.seg .tr { background: var(--train-bg); border-radius: 2px; }
.seg .nt { color: var(--muted); }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
.hist div { flex: 1; background: var(--blue); border-radius: 2px 2px 0 0; min-height: 1px; position: relative; }
.histl { display: flex; gap: 3px; font-size: 10px; color: var(--faint); }
.histl span { flex: 1; text-align: center; overflow: hidden; }
.cmd { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.cmd code { flex: 1; font-family: var(--mono); font-size: 11.5px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; overflow-x: auto; white-space: nowrap; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.note { background: var(--amber-bg); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; }
select { font: inherit; font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); }
@media (max-width: 820px) { header { position: static; } .split { grid-template-columns: 1fr; } .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htop">
      <h1>Fine-tune Control Panel</h1>
      <span class="meta" id="meta">loading…</span>
      <span class="spacer"></span>
      <span class="meta" id="fresh"></span>
      <button class="btn" id="reload" title="Reload data.js">Refresh</button>
      <button class="btn" id="theme" title="Toggle light/dark">Theme</button>
    </div>
    <nav id="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="runs">Runs</button>
      <button data-tab="data">Data</button>
      <button data-tab="models">Models &amp; configs</button>
      <button data-tab="cluster">Cluster</button>
    </nav>
  </div>
</header>
<main id="main"><div class="empty">Loading data.js…</div></main>

<script>
"use strict";
/* ------------------------------------------------------------------ state + utils */
const C = { blue: "#2a78d6", orange: "#eb6834", aqua: "#1baf7a" };
const S = { tab: "overview", run: null, ds: null, sample: {}, cfg: null, smooth: true };
try { Object.assign(S, JSON.parse(localStorage.getItem("ftpanel") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("ftpanel", JSON.stringify({ tab: S.tab, run: S.run, ds: S.ds, cfg: S.cfg, smooth: S.smooth })); } catch (e) {} };
let D = null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const big = v => { if (v == null) return "–"; const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(2) + "B" : a >= 1e6 ? (v / 1e6).toFixed(2) + "M" : a >= 1e4 ? (v / 1e3).toFixed(1) + "k" : num(v); };
const bytes = b => { if (b == null) return "–"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return b.toFixed(i > 2 ? 1 : 0) + " " + u[i]; };
const dur = s => { if (s == null || !isFinite(s)) return "–"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const ago = ts => ts ? dur(Date.now() / 1000 - ts) + " ago" : "–";
const pct = (a, b) => b ? Math.max(0, Math.min(100, 100 * a / b)) : 0;
function pill(state) {
  const s = String(state || "").toLowerCase();
  const cls = /running|completing|configuring/.test(s) ? "p-run" : /finish|complete|done|ready/.test(s) ? "p-ok"
    : /fail|cancel|timeout|oom|error|node_fail|out_of_me/.test(s) ? "p-bad" : /pend|stopp|requeue|wait/.test(s) ? "p-wait" : "p-idle";
  return `<span class="pill ${cls}">${esc(state || "–")}</span>`;
}
function last(arr) { if (!arr) return null; for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; return null; }
function copyBtn(text) { return `<div class="cmd"><code>${esc(text)}</code><button class="btn" data-copy="${esc(text)}">Copy</button></div>`; }

/* ------------------------------------------------------------------ data loading */
function load() {
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  s.onload = () => { D = window.FT_DATA; s.remove(); render(); };
  s.onerror = () => { s.remove(); if (!D) $("#main").innerHTML = `<div class="card empty">No <span class="mono">data.js</span> next to this page.<br><br>
    On the portal: <span class="mono">bash finetune/scripts/panel.sh snapshot</span> (or <span class="mono">launch_from_mac.sh &lt;id&gt; status</span> on your Mac).</div>`; };
  document.head.appendChild(s);
}
const LIVE = location.protocol.startsWith("http");
if (LIVE) setInterval(load, 60000);
setInterval(() => { if (D) $("#fresh").textContent = "data " + ago(D.generated_ts) + (LIVE ? " · auto-refresh 60s" : " · snapshot"); }, 5000);

/* ------------------------------------------------------------------ derived */
function runInfo(r) {
  const m = r.metrics || { steps: [], series: {}, time: [] }, s = r.status || {};
  const steps = m.steps || [], t = m.time || [];
  const step = s.step ?? last(steps), max = s.max_steps;
  let secPerStep = null;
  const n = steps.length;
  if (n >= 3) { // median over the last 10 steps, so a checkpoint pause doesn't skew it
    const d = []; for (let j = Math.max(1, n - 10); j < n; j++) { const ds = steps[j] - steps[j - 1]; if (ds > 0 && t[j] > t[j - 1]) d.push((t[j] - t[j - 1]) / ds); }
    d.sort((a, b) => a - b); if (d.length) secPerStep = d[Math.floor(d.length / 2)]; }
  const st = r.stop_requested && s.state === "running" ? "stopping" : (s.state || (r.checkpoints?.length ? "checkpointed" : "–"));
  const running = st === "running" || st === "stopping";
  const updatedAgo = s.updated_at ? (Date.now() - Date.parse(s.updated_at.replace(" ", "T"))) / 1000 : null;
  return {
    step, max, state: st, running, secPerStep,
    eta: running && secPerStep && max ? (max - step) * secPerStep : null,
    loss: last(m.series?.["train/CE loss"]), tps: last(m.series?.["throughput/device/TPS"]),
    mfu: last(m.series?.["throughput/device/MFU"]), mem: last(m.series?.["gpu_memory/GPU active mem (GiB)"]),
    stale: running && updatedAgo != null && updatedAgo > 1800,
  };
}
function jobState(id) {
  if (!D?.jobs) return null;
  const q = D.jobs.queue.find(j => j.id === id); if (q) return q.state;
  const h = D.jobs.history.find(j => j.id === id); return h ? h.state : null;
}

/* ------------------------------------------------------------------ chart */
let chartId = 0;
function ema(ys, a = 0.8) { let p = null; return ys.map(y => y == null ? null : (p = p == null ? y : a * p + (1 - a) * y)); }
function lineChart({ title, sub, series, xs, fmt = v => num(v, 3), yMin }) {
  const id = "ch" + (++chartId);
  const pts = series.map(s => s.ys.map((y, i) => [xs[i], y]).filter(p => p[1] != null && isFinite(p[1])));
  const all = pts.flat();
  if (!all.length) return "";
  const W = 560, H = 190, L = 46, R = 10, T = 8, B = 22;
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = yMin ?? Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) { y1 += Math.abs(y1) * .1 || 1; y0 -= yMin == null ? (Math.abs(y0) * .1 || 1) : 0; }
  const pad = (y1 - y0) * .06; y1 += pad; if (yMin == null) y0 -= pad;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const ticks = (a, b, n) => { const st = Math.pow(10, Math.floor(Math.log10((b - a) / n))); const m = [1, 2, 5, 10].find(m => (b - a) / (st * m) <= n) * st; const r = []; for (let v = Math.ceil(a / m) * m; v <= b + 1e-9; v += m) r.push(+v.toPrecision(10)); return r; };
  let g = `<g class="axis">`;
  for (const v of ticks(y0, y1, 4)) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${esc(fmt(v))}</text>`;
  for (const v of ticks(x0, x1, 6).filter(v => Number.isInteger(v))) g += `<text x="${X(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`;
  g += `</g>`;
  const paths = series.map((s, i) => {
    const p = pts[i]; if (!p.length) return "";
    const d = p.map((q, j) => (j ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1)).join("");
    const dot = p.length === 1 ? `<circle cx="${X(p[0][0])}" cy="${Y(p[0][1])}" r="3" fill="${s.color}"/>` : "";
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.faint ? 1.2 : 2}" stroke-opacity="${s.faint ? .35 : 1}" stroke-linejoin="round"/>${dot}`;
  }).join("");
  const legend = series.filter(s => !s.faint).length > 1 ? `<span class="legend">${series.filter(s => !s.faint).map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</span>` : "";
  CHARTS[id] = { xs, series, X, Y, W, H, L, R, T, B, fmt, x0, x1 };
  return `<div class="card chart" id="${id}"><div class="ttl"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}<span class="spacer"></span>${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${paths}<line class="hx" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/>
    <g class="hd"></g><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
const CHARTS = {};
function wireCharts() {
  for (const [id, c] of Object.entries(CHARTS)) {
    const el = document.getElementById(id); if (!el) continue;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), hx = el.querySelector(".hx"), hd = el.querySelector(".hd");
    svg.addEventListener("mousemove", ev => {
      const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) / r.width * c.W;
      const xv = c.x0 + (sx - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
      let bi = 0, bd = Infinity; c.xs.forEach((x, i) => { const d = Math.abs(x - xv); if (d < bd) { bd = d; bi = i; } });
      const x = c.xs[bi]; const rows = c.series.filter(s => s.ys[bi] != null && !s.faint);
      if (!rows.length) return;
      hx.setAttribute("x1", c.X(x)); hx.setAttribute("x2", c.X(x)); hx.setAttribute("visibility", "visible");
      hd.innerHTML = rows.map(s => `<circle cx="${c.X(x)}" cy="${c.Y(s.ys[bi])}" r="3.5" fill="${s.color}" stroke="var(--panel)" stroke-width="1.5"/>`).join("");
      tip.innerHTML = `<b>step ${x}</b>` + rows.map(s => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:5px"></i>${esc(s.name)}: <b>${esc(c.fmt(s.ys[bi]))}</b></div>`).join("");
      tip.style.display = "block";
      const px = c.X(x) / c.W * r.width, w = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(px + 12, 0), r.width - w) + (px + 12 + w > r.width ? -(w + 24) : 0) + "px";
      tip.style.top = "30px";
    });
    svg.addEventListener("mouseleave", () => { tip.style.display = "none"; hx.setAttribute("visibility", "hidden"); hd.innerHTML = ""; });
  }
}

/* ------------------------------------------------------------------ views */
function vOverview() {
  const runs = D.runs || [], infos = runs.map(r => [r, runInfo(r)]);
  const active = infos.filter(([, i]) => i.running);
  const q = D.jobs?.queue || [];
  const nodes = D.cluster?.nodes || [];
  const big7 = nodes.filter(n => /a100|h100|h200/i.test(n.gpu_type));
  const free = big7.reduce((a, n) => a + (/down|drain|fail|maint/.test(n.state) ? 0 : n.gpus_total - n.gpus_used), 0);
  const tot = big7.reduce((a, n) => a + n.gpus_total, 0);
  let h = `<div class="grid kpis">
    <div class="card kpi"><div class="l">Training now</div><div class="v">${active.length}</div><div class="s">${runs.length} runs in total</div></div>
    <div class="card kpi"><div class="l">My Slurm jobs</div><div class="v">${q.length}</div><div class="s">${q.filter(j => j.state === "RUNNING").length} running · ${q.filter(j => j.state === "PENDING").length} pending</div></div>
    <div class="card kpi"><div class="l">Free A100/H100 GPUs</div><div class="v">${D.cluster?.available ? free + " / " + tot : "–"}</div><div class="s">${D.cluster?.available ? big7.length + " nodes" : "Slurm not reachable from " + esc(D.host)}</div></div>
    <div class="card kpi"><div class="l">Free on ${esc((D.root || "").split("/").slice(0, 2).join("/") || "disk")}</div><div class="v">${D.disk ? bytes(D.disk.free_bytes) : "–"}</div><div class="s">7B checkpoint ≈ 88 GB</div></div>
  </div>`;
  h += `<div class="card" style="margin-top:12px"><h2>Runs</h2>${runsTable(infos.slice(0, 12))}</div>`;
  if (q.length) h += `<div class="card" style="margin-top:12px"><h2>My queue</h2>${queueTable(q)}</div>`;
  const hist = (D.jobs?.history || []).slice(0, 10);
  if (hist.length) h += `<div class="card" style="margin-top:12px"><h2>Recent jobs (7 days)</h2>${histTable(hist)}</div>`;
  return h;
}
function runsTable(infos) {
  if (!infos.length) return `<div class="empty">No runs yet. Create one: <span class="mono">python finetune/ft.py new my-run</span>, then <span class="mono">bash finetune/scripts/submit.sh finetune/configs/my-run.yaml</span></div>`;
  return `<div class="tw"><table><tr><th>Run</th><th>State</th><th>Progress</th><th class="n">Step</th><th class="n">Loss</th><th class="n">Tok/s/GPU</th><th class="n">ETA</th><th class="n">Checkpoints</th><th>Updated</th></tr>
  ${infos.map(([r, i]) => `<tr class="click" data-run="${esc(r.name)}"><td><b>${esc(r.name)}</b>${r.config?.notes ? `<div class="faint small">${esc(r.config.notes)}</div>` : ""}</td>
    <td>${pill(i.state)}${i.stale ? ` <span class="pill p-wait" title="no update for 30+ min">stale?</span>` : ""}</td>
    <td style="min-width:110px"><div class="bar"><i style="width:${pct(i.step, i.max)}%;${i.state === "failed" ? "background:var(--red)" : /finish/.test(i.state) ? "background:var(--aqua)" : ""}"></i></div></td>
    <td class="n">${num(i.step)}${i.max ? " / " + num(i.max) : ""}</td><td class="n">${num(i.loss, 3)}</td><td class="n">${num(i.tps)}</td>
    <td class="n">${i.eta != null ? dur(i.eta) : "–"}</td><td class="n">${r.checkpoints.length ? r.checkpoints.map(c => esc(c.name)).join(", ") : "–"}</td>
    <td class="small muted">${esc(r.status?.updated_at || "")}</td></tr>`).join("")}</table></div>`;
}
function queueTable(q) {
  return `<div class="tw"><table><tr><th>Job</th><th>Name</th><th>State</th><th class="n">Elapsed</th><th class="n">Limit</th><th>GPUs</th><th>Node / reason</th></tr>
  ${q.map(j => `<tr><td class="mono">${esc(j.id)}</td><td>${esc(j.name)}</td><td>${pill(j.state)}</td><td class="n">${esc(j.elapsed)}</td><td class="n">${esc(j.limit)}</td><td class="mono small">${esc(j.gres === "(null)" ? "–" : j.gres)}</td><td class="small">${esc(j.reason)}${j.state === "PENDING" && j.start && j.start !== "N/A" ? `<div class="faint">est. start ${esc(j.start)}</div>` : ""}</td></tr>`).join("")}</table></div>`;
}
function histTable(h) {
  return `<div class="tw"><table><tr><th>Job</th><th>Name</th><th>State</th><th class="n">Elapsed</th><th class="n">GPUs</th><th>Start</th><th>Node</th><th>Exit</th></tr>
  ${h.map(j => `<tr><td class="mono">${esc(j.id)}</td><td>${esc(j.name)}</td><td>${pill(j.state)}</td><td class="n">${esc(j.elapsed)}</td><td class="n">${j.gpus || "–"}</td><td class="small">${esc(j.start)}</td><td class="small">${esc(j.nodes)}</td><td class="mono small">${esc(j.exit)}</td></tr>`).join("")}</table></div>`;
}

function vRuns() {
  const runs = D.runs || [];
  if (!runs.length) return `<div class="card">${runsTable([])}</div>`;
  if (!runs.find(r => r.name === S.run)) S.run = runs[0].name;
  const list = runs.map(r => { const i = runInfo(r); return `<div class="li ${r.name === S.run ? "on" : ""}" data-run="${esc(r.name)}"><div class="t">${esc(r.name)}</div><div class="d">${pill(i.state)}<span>${i.step != null ? "step " + num(i.step) + (i.max ? "/" + num(i.max) : "") : ""}</span></div></div>`; }).join("");
  return `<div class="split"><div class="card list">${list}</div><div>${runDetail(runs.find(r => r.name === S.run))}</div></div>`;
}
function runDetail(r) {
  const i = runInfo(r), m = r.metrics || {}, sr = m.series || {}, xs = m.steps || [], s = r.status || {};
  const cfgPath = r.config?.config_path || "finetune/configs/" + r.name + ".yaml";
  const relCfg = cfgPath.includes("/finetune/") ? "finetune/" + cfgPath.split("/finetune/").pop() : cfgPath;
  let h = `<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">${esc(r.name)}</h2>${pill(i.state)}
    ${s.job_id ? `<span class="muted small">job ${esc(s.job_id)} · ${esc(s.host || "")} · ${s.world_size || "?"} GPU(s)</span>` : ""}</div>
    ${r.config?.notes ? `<div class="muted small" style="margin-top:4px">${esc(r.config.notes)}</div>` : ""}
    ${s.error ? `<div class="note" style="margin-top:10px;background:var(--red-bg)"><b>Error:</b> <span class="mono">${esc(s.error)}</span></div>` : ""}
    <div class="stats" style="margin-top:12px">
      ${[["Step", `${num(i.step)}${i.max ? " / " + num(i.max) : ""}`], ["Progress", i.max ? num(pct(i.step, i.max), 0) + "%" : "–"],
         ["Elapsed", dur(s.elapsed_sec)], ["ETA", i.eta != null ? dur(i.eta) : "–"], ["Time / step", i.secPerStep ? num(i.secPerStep, 1) + " s" : "–"],
         ["Loss (last)", num(i.loss, 4)], ["Tokens/s/GPU", num(i.tps)], ["MFU", i.mfu != null ? num(i.mfu, 1) + "%" : "–"],
         ["GPU mem (active)", i.mem != null ? num(i.mem, 1) + " GiB" : "–"], ["Started", esc(s.started_at || "–")]]
        .map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}
    </div></div>`;
  const loss = sr["train/CE loss"];
  const charts = [];
  if (loss) {
    const sm = ema(loss);
    charts.push(lineChart({ title: "Training loss", sub: S.smooth ? "CE, EMA-smoothed (raw faint)" : "cross-entropy", xs,
      series: S.smooth ? [{ name: "raw", ys: loss, color: C.blue, faint: true }, { name: "loss (EMA)", ys: sm, color: C.blue }] : [{ name: "loss", ys: loss, color: C.blue }] }));
  }
  if (sr["throughput/device/TPS"]) charts.push(lineChart({ title: "Throughput", sub: "tokens / s / GPU", xs, fmt: v => big(v), series: [{ name: "tokens/s/GPU", ys: sr["throughput/device/TPS"], color: C.aqua }], yMin: 0 }));
  const ma = sr["gpu_memory/GPU active mem (GiB)"], mr = sr["gpu_memory/GPU reserved mem (GiB)"];
  if (ma || mr) charts.push(lineChart({ title: "GPU memory", sub: "GiB per GPU", xs, fmt: v => num(v, 0), yMin: 0,
    series: [mr && { name: "reserved", ys: mr, color: C.orange }, ma && { name: "active", ys: ma, color: C.blue }].filter(Boolean) }));
  const lr = Object.keys(sr).find(k => k.startsWith("optim/LR"));
  if (lr) charts.push(lineChart({ title: "Learning rate", xs, fmt: v => v.toExponential(1), yMin: 0, series: [{ name: "LR", ys: sr[lr], color: C.orange }] }));
  if (sr["optim/total grad norm"]) charts.push(lineChart({ title: "Gradient norm", sub: "before clipping", xs, fmt: v => num(v, 2), series: [{ name: "grad norm", ys: sr["optim/total grad norm"], color: C.aqua }], yMin: 0 }));
  if (sr["throughput/device/MFU"]) charts.push(lineChart({ title: "MFU", sub: "% of peak bf16 FLOPs", xs, fmt: v => num(v, 0) + "%", yMin: 0, series: [{ name: "MFU", ys: sr["throughput/device/MFU"], color: C.blue }] }));
  if (charts.length) h += `<div style="display:flex;justify-content:flex-end;margin:12px 0 6px"><label class="small muted"><input type="checkbox" id="smooth" ${S.smooth ? "checked" : ""}> smooth loss</label></div><div class="grid charts">${charts.join("")}</div>`;
  else h += `<div class="card empty" style="margin-top:12px">No metrics yet${i.state === "–" ? " (job not started)" : ""}.</div>`;

  // jobs + checkpoints + export
  const jobs = r.jobs || [];
  h += `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));margin-top:12px">`;
  h += `<div class="card"><h2>Pipeline jobs</h2>${jobs.length ? `<table><tr><th>Stage</th><th>Job</th><th>State</th><th>Submitted</th></tr>${jobs.slice().reverse().map(j => `<tr><td>${esc(j.stage)}</td><td class="mono">${esc(j.job_id)}</td><td>${pill(jobState(j.job_id) || "unknown")}</td><td class="small muted">${esc(j.time)}</td></tr>`).join("")}</table>` : `<div class="muted small">No jobs submitted through submit.sh.</div>`}</div>`;
  h += `<div class="card"><h2>Checkpoints &amp; exports</h2>${r.checkpoints.length || r.hf_exports.length ? `<table><tr><th>Folder</th><th class="n">Size</th><th>Written</th></tr>
    ${r.checkpoints.map(c => `<tr><td class="mono">${esc(c.name)}</td><td class="n">${bytes(c.bytes)}</td><td class="small muted">${new Date(c.mtime * 1000).toLocaleString()}</td></tr>`).join("")}
    ${r.hf_exports.map(c => `<tr><td class="mono">${esc(c.name)} <span class="pill p-ok">HF</span></td><td class="n">${bytes(c.bytes)}</td><td></td></tr>`).join("")}</table>` : `<div class="muted small">None yet.</div>`}
    <div class="faint small" style="margin-top:6px">${esc(r.dir)}</div></div></div>`;

  // actions
  h += `<div class="card" style="margin-top:12px"><h2>Commands</h2><div class="muted small" style="margin-bottom:6px">On the portal, from the repo (<span class="mono">cd /bigtemp/${esc(D.user)}/OLMo-core</span>):</div>
    ${i.running ? copyBtn(`python finetune/ft.py stop ${relCfg}`) : ""}
    ${copyBtn(`bash finetune/scripts/submit.sh ${relCfg} --no-fit-check`)}<div class="faint small" style="margin:-2px 0 6px">re-submit: continues from the latest checkpoint (raise train.steps first to train longer)</div>
    ${r.checkpoints.length ? copyBtn(`bash finetune/scripts/submit.sh ${relCfg} --export-only`) : ""}
    ${r.hf_exports.length ? copyBtn(`bash finetune/scripts/launch_from_mac.sh ${D.user} download ${r.name}`) + `<div class="faint small" style="margin-top:-2px">on your Mac: copies the Hugging Face model to ~/Desktop/project/models/</div>` : ""}
  </div>`;
  // events + log
  const ev = r.events || [];
  if (ev.length) h += `<div class="card" style="margin-top:12px"><h2>Events</h2><table>${ev.slice().reverse().slice(0, 25).map(e => `<tr><td class="small muted" style="white-space:nowrap">${esc(e.time)}</td><td>${pill(e.event)}</td><td class="n">step ${num(e.step)}</td><td class="mono small">${esc(e.path || e.error || (e.max_steps ? "max steps " + e.max_steps : ""))}</td></tr>`).join("")}</table></div>`;
  if (r.log_tail) h += `<div class="card" style="margin-top:12px"><h2>Log tail <span class="faint small mono">${esc(r.log_file || "")}</span></h2><pre id="logtail">${esc(r.log_tail)}</pre></div>`;
  if (r.config && Object.keys(r.config).length) h += `<div class="card" style="margin-top:12px"><h2>Run config</h2><pre>${esc(JSON.stringify(r.config, null, 2))}</pre></div>`;
  return h;
}

function vData() {
  const ds = D.datasets || [];
  if (!ds.length) return `<div class="card empty">No prepared datasets. <span class="mono">python finetune/ft.py prepare-data CONFIG</span> tokenizes them (also done by the prepare job).</div>`;
  if (!ds.find(d => d.data_key === S.ds)) S.ds = ds[0].data_key;
  const list = ds.map(d => `<div class="li ${d.data_key === S.ds ? "on" : ""}" data-ds="${esc(d.data_key)}"><div class="t">${esc(d.data_key)}</div><div class="d"><span>${big(d.total_tokens)} tokens</span><span>${d.datasets.length} source(s)</span></div></div>`).join("");
  const d = ds.find(x => x.data_key === S.ds);
  let h = `<div class="card"><h2>${esc(d.data_key)}</h2><div class="stats">
    ${[["Examples", num(d.total_examples)], ["Tokens", big(d.total_tokens)], ["Trainable tokens", big(d.trainable_tokens) + ` (${num(pct(d.trainable_tokens, d.total_tokens), 0)}%)`],
       ["Sequence length", num(d.seq_len)], ["Packed sequences", d.pack ? num(d.pack.instances) : "not packed"], ["Steps / epoch", d.pack ? num(d.pack.steps_per_epoch) : "–"],
       ["Size on disk", bytes(d.bytes)], ["Created", esc(d.created_at)]].map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}
    </div><div class="muted small" style="margin-top:8px">tokenizer <span class="mono">${esc(d.tokenizer)}</span>${d.chat_template ? ` · template <span class="mono">${esc(String(d.chat_template).slice(0, 40))}</span>` : ""} · used by run <b>${esc(d.run_name)}</b></div></div>`;
  h += `<div class="card" style="margin-top:12px"><h2>Sources</h2><div class="tw"><table><tr><th>Name</th><th>Source</th><th>Format</th><th class="n">Rows read</th><th class="n">Kept</th><th class="n">Skipped</th><th class="n">Tokens</th><th class="n">Trainable</th><th class="n">Mean len</th><th class="n">p95</th><th class="n">Max</th></tr>
    ${d.datasets.map(x => { const sk = Object.entries(x).filter(([k]) => k.startsWith("skipped_") || k === "truncated" || k === "mask_misaligned").filter(([, v]) => v);
      return `<tr><td><b>${esc(x.name)}</b></td><td class="mono small" style="word-break:break-all">${esc(x.source)}${x.subset ? ":" + esc(x.subset) : ""}</td><td>${esc(x.format)}</td><td class="n">${num(x.rows_read)}</td><td class="n">${num(x.examples)}</td>
      <td class="n" title="${esc(sk.map(([k, v]) => k + "=" + v).join(", "))}">${sk.length ? sk.map(([k, v]) => `${num(v)} <span class="faint small">${esc(k.replace("skipped_", ""))}</span>`).join("<br>") : "0"}</td>
      <td class="n">${big(x.tokens)}</td><td class="n">${num(100 * x.trainable_fraction, 0)}%</td><td class="n">${num(x.length?.mean)}</td><td class="n">${num(x.length?.p95)}</td><td class="n">${num(x.length?.max)}</td></tr>`; }).join("")}</table></div></div>`;
  h += `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:12px">` + d.datasets.map(x => {
    const L = x.length || {}, c = L.hist_counts || [], e = L.hist_edges || [], mx = Math.max(1, ...c);
    const k = v => v >= 1024 ? +(v / 1024).toFixed(1) + "k" : v;
    const lab = i => i < e.length - 1 ? k(e[i]) + "+" : "> " + k(e[e.length - 1] - 1);
    return `<div class="card"><h2>${esc(x.name)} <span class="faint small">example length (tokens)</span></h2><div class="hist">${c.map((v, i) => `<div style="height:${100 * v / mx}%;${i === c.length - 1 && v ? "background:var(--orange)" : ""}" title="${lab(i)}: ${v} examples"></div>`).join("")}</div>
      <div class="histl">${c.map((_, i) => `<span>${lab(i)}</span>`).join("")}</div>${c[c.length - 1] ? `<div class="small muted" style="margin-top:6px"><span style="color:var(--orange)">■</span> longer than seq_len (${x.format === "text" ? "split into pieces" : "skipped / truncated"})</div>` : ""}</div>`;
  }).join("") + `</div>`;
  // samples
  h += `<div class="card" style="margin-top:12px"><h2>What the model sees</h2><div class="muted small" style="margin-bottom:8px">Decoded training examples. <span class="seg" style="display:inline;padding:1px 4px;border:0"><span class="tr">highlighted</span></span> tokens are trained on (loss); the rest is context only.</div>
    ${d.datasets.map(x => { const k = d.data_key + "/" + x.name, n = (x.samples || []).length; const si = Math.min(S.sample[k] || 0, Math.max(0, n - 1)); const sm = x.samples?.[si];
      return `<h3 style="display:flex;gap:8px;align-items:center">${esc(x.name)} <select data-sample="${esc(k)}">${(x.samples || []).map((s, j) => `<option value="${j}" ${j === si ? "selected" : ""}>example ${j + 1} · ${s.tokens} tokens · ${s.trainable} trained</option>`).join("")}</select></h3>
        ${sm ? `<div class="seg">${sm.segments.map(g => `<span class="${g.train ? "tr" : "nt"}">${esc(g.t)}</span>`).join("")}</div>` : `<div class="muted small">no samples</div>`}`; }).join("")}</div>`;
  return `<div class="split"><div class="card list">${list}</div><div>${h}</div></div>`;
}

function vModels() {
  const ms = D.models || [], cs = D.configs || [];
  let h = `<div class="card"><h2>Prepared base models <span class="faint small">${esc(D.root)}/models</span></h2>${ms.length ? `<div class="tw"><table><tr><th>Folder</th><th>Source</th><th class="n">Layers</th><th class="n">d_model</th><th class="n">Size</th><th>Prepared</th></tr>
    ${ms.map(m => `<tr><td class="mono small">${esc(m.key)}</td><td class="small">${esc(m.source?.source || "")} <span class="mono">${esc(m.source?.path || "")}</span></td><td class="n">${num(m.n_layers)}</td><td class="n">${num(m.d_model)}</td><td class="n">${bytes(m.bytes)}</td><td class="small muted">${esc(m.source?.prepared_at || "")}</td></tr>`).join("")}</table></div>`
    : `<div class="muted small">None yet (local OLMo-core checkpoints used in place are not listed here).</div>`}</div>`;
  if (!cs.find(c => c.file === S.cfg) && cs.length) S.cfg = cs[0].file;
  h += `<div class="card" style="margin-top:12px"><h2>Run configs <span class="faint small">finetune/configs/</span></h2><div class="tw"><table><tr><th>File</th><th>Name</th><th>Model</th><th>Data</th><th>Packed</th><th></th></tr>
    ${cs.map(c => `<tr class="click" data-cfg="${esc(c.file)}"><td class="mono small">${esc(c.file)}</td><td>${esc(c.name || "")}</td>
      ${c.error ? `<td colspan="3"><span class="pill p-bad">invalid</span> <span class="small">${esc(c.error.split("\n").slice(0, 3).join(" "))}</span></td>`
        : `<td>${c.model_ready ? pill("ready") : pill("to prepare")}</td><td>${c.data_ready ? pill("ready") : pill("to prepare")}</td><td>${c.packed ? pill("ready") : pill("–")}</td>`}
      <td>${c.file === S.cfg ? "▸" : ""}</td></tr>`).join("")}</table></div>
    ${S.cfg ? `<h3>${esc(S.cfg)}</h3>${copyBtn("bash finetune/scripts/submit.sh finetune/configs/" + S.cfg)}<pre>${esc((cs.find(c => c.file === S.cfg) || {}).text || "")}</pre>` : ""}
    <div class="faint small" style="margin-top:8px">New run: <span class="mono">python finetune/ft.py new &lt;name&gt;</span> creates configs/&lt;name&gt;.yaml from the commented template.</div></div>`;
  return h;
}

function vCluster() {
  const c = D.cluster || {};
  let h = "";
  if (!c.available) h += `<div class="note">Slurm commands were not available where data.js was generated (${esc(D.host)}).</div>`;
  else {
    const nodes = c.nodes.slice().sort((a, b) => (b.gpus_total - b.gpus_used) - (a.gpus_total - a.gpus_used));
    h += `<div class="card"><h2>GPU nodes (gpu partition)</h2><div class="tw"><table><tr><th>Node</th><th>GPU</th><th>State</th><th>GPUs in use</th><th class="n">Free</th><th class="n">CPUs</th><th class="n">Mem GB</th></tr>
      ${nodes.map(n => { const down = /down|drain|fail|maint|unk/.test(n.state); const fr = down ? 0 : n.gpus_total - n.gpus_used;
        return `<tr><td class="mono">${esc(n.node)}</td><td class="small">${esc(n.gpu_type || "–")}</td><td>${pill(n.state)}</td>
        <td style="min-width:120px"><div style="display:flex;gap:6px;align-items:center"><div class="bar" style="flex:1"><i style="width:${pct(n.gpus_used, n.gpus_total)}%;${n.gpus_used >= n.gpus_total ? "background:var(--orange)" : ""}"></i></div><span class="small mono">${n.gpus_used}/${n.gpus_total}</span></div></td>
        <td class="n"><b style="color:${fr ? "var(--aqua)" : "var(--faint)"}">${fr}</b></td><td class="n small">${esc(n.cpus)}</td><td class="n small">${esc(n.mem_gb)}</td></tr>`; }).join("")}</table></div>
      <div class="faint small" style="margin-top:6px">Constraint names for <span class="mono">slurm.constraint</span>: h100_94gb (serval06-09, 2 GPUs/node), a100_80gb (cheetah04, 4 GPUs).</div></div>`;
  }
  const q = D.jobs?.queue || [], hist = D.jobs?.history || [];
  h += `<div class="card" style="margin-top:12px"><h2>My queue</h2>${q.length ? queueTable(q) : `<div class="muted small">No jobs queued or running.</div>`}</div>`;
  h += `<div class="card" style="margin-top:12px"><h2>Job history (7 days)</h2>${hist.length ? histTable(hist) : `<div class="muted small">No jobs.</div>`}</div>`;
  return h;
}

/* ------------------------------------------------------------------ render */
function render() {
  if (!D) return;
  for (const k in CHARTS) delete CHARTS[k];
  $("#meta").innerHTML = `<b>${esc(D.user)}</b>@${esc(D.host)} · <span class="mono">${esc(D.root)}</span>`;
  $("#fresh").textContent = "data " + ago(D.generated_ts) + (LIVE ? " · auto-refresh 60s" : " · snapshot");
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  const logScroll = $("#logtail")?.scrollTop;
  const y = window.scrollY;
  $("#main").innerHTML = { overview: vOverview, runs: vRuns, data: vData, models: vModels, cluster: vCluster }[S.tab]();
  wireCharts();
  const lt = $("#logtail"); if (lt) lt.scrollTop = logScroll ?? lt.scrollHeight;
  window.scrollTo(0, y);
  save();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-run],[data-ds],[data-cfg],[data-copy]"); if (!t) return;
  if (t.dataset.copy != null) { navigator.clipboard?.writeText(t.dataset.copy).then(() => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy", 1200); }); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; window.scrollTo(0, 0); }
  if (t.dataset.run) { S.run = t.dataset.run; S.tab = "runs"; }
  if (t.dataset.ds) S.ds = t.dataset.ds;
  if (t.dataset.cfg) S.cfg = t.dataset.cfg;
  render();
});
document.addEventListener("change", ev => {
  if (ev.target.id === "smooth") { S.smooth = ev.target.checked; render(); }
  if (ev.target.dataset.sample) { S.sample[ev.target.dataset.sample] = +ev.target.value; render(); }
});
$("#reload").onclick = load;
$("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
load();
</script>
</body>
</html>
